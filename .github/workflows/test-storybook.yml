# Interaction + axe-core via @storybook/addon-a11y (parameters.a11y.test).
# Default is "todo" (baseline). Stories with a11y.test: "error" fail this job.
name: Storybook Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: test-storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run playwright:install
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

      - name: Run Storybook tests with coverage
        run: bun run test-storybook:coverage
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
